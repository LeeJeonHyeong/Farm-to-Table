<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#5B7553"/>
  <!-- Leaf body -->
  <ellipse cx="265" cy="215" rx="105" ry="135"
    transform="rotate(-18 265 215)" fill="#F3F1E7"/>
  <!-- Center vein -->
  <line x1="228" y1="118" x2="285" y2="318"
    stroke="#5B7553" stroke-width="13" stroke-linecap="round"/>
  <!-- Side veins -->
  <line x1="250" y1="175" x2="210" y2="210"
    stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <line x1="260" y1="220" x2="310" y2="240"
    stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <line x1="265" y1="265" x2="220" y2="290"
    stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <!-- Stem -->
  <line x1="270" y1="325" x2="256" y2="400"
    stroke="#F3F1E7" stroke-width="18" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="200" y1="400" x2="312" y2="400"
    stroke="#F3F1E7" stroke-width="18" stroke-linecap="round"/>
</svg>
