<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이콘 생성기</title>
  <style>
    body { font-family: sans-serif; padding: 32px; background: #F3F1E7; color: #20281F; }
    button { margin: 8px; padding: 10px 20px; background: #5B7553; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    canvas { display: block; margin: 16px 0; border: 1px solid #D8D2C0; border-radius: 8px; }
    .note { font-size: 13px; color: #5B6358; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Farm-to-Table PWA 아이콘 생성기</h2>
  <p>버튼을 클릭하면 PNG 아이콘이 자동으로 다운로드됩니다.<br>
     다운로드된 파일을 <code>public/</code> 폴더에 넣어주세요.</p>
  <button onclick="generate(192)">icon-192.png 다운로드</button>
  <button onclick="generate(512)">icon-512.png 다운로드</button>
  <canvas id="preview" width="192" height="192"></canvas>
  <p class="note">생성 후 이 파일(generate-icons.html)은 삭제해도 됩니다.</p>

  <script>
    const SVG_SRC = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="96" fill="#5B7553"/>
      <ellipse cx="265" cy="215" rx="105" ry="135" transform="rotate(-18 265 215)" fill="#F3F1E7"/>
      <line x1="228" y1="118" x2="285" y2="318" stroke="#5B7553" stroke-width="13" stroke-linecap="round"/>
      <line x1="250" y1="175" x2="210" y2="210" stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <line x1="260" y1="220" x2="310" y2="240" stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <line x1="265" y1="265" x2="220" y2="290" stroke="#5B7553" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <line x1="270" y1="325" x2="256" y2="400" stroke="#F3F1E7" stroke-width="18" stroke-linecap="round"/>
      <line x1="200" y1="400" x2="312" y2="400" stroke="#F3F1E7" stroke-width="18" stroke-linecap="round"/>
    </svg>`;

    function generate(size) {
      const canvas = document.getElementById("preview");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const blob = new Blob([SVG_SRC], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        const a = document.createElement("a");
        a.download = `icon-${size}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    }

    // 미리보기
    window.onload = () => generate(192);
  </script>
</body>
</html>
