<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm-to-Table 역경매 데모</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5B7553" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="F2T Market" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Google Fonts (PERF-03: JSX 중복 제거 후 index.html 단일 로드) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fraunces 는 opsz(광학 크기) 가변 축을 빼고 받는다. 축을 포함하면 latin 서브셋이
      65KB, 빼면 35KB 다. 제목에만 쓰는 장식 서체가 초기 로드의 15% 를 차지하던 걸 줄인다.
      가중치 600·700 은 그대로라 글자 모양은 유지된다.
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />

    <!-- 로그인 직후 바로 붙는 곳들. 모바일에서 TLS 핸드셰이크 지연을 줄인다. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />

    <!--
      토스페이먼츠 SDK(56KB)는 여기서 받지 않는다. 결제 단계에 들어간 사용자만 쓰는데
      head 의 동기 스크립트로 두면 모든 첫 진입에 비용을 물린다. App.jsx 의
      loadTossPayments() 가 결제 직전에 주입한다.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
